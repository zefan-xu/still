plugins {
    id 'java'
    id 'jacoco'
    id 'info.solidsoft.pitest' version '1.19.0'
    id 'net.ltgt.errorprone' version '5.1.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

sourceSets {
    main {
        java {
            srcDir '../app/src/main/java'
            include 'org/still/saver/core/*.java'
            include 'org/still/saver/gif/AnimatedGifEncoder.java'
            include 'org/still/saver/ui/LibraryModel.java'
            include 'org/still/saver/ui/Format.java'
            exclude 'org/still/saver/core/PublicPageResolver.java'
        }
    }
    test {
        resources {
            // Tests word core error codes in the app's English text.
            srcDir '../app/src/main/res/values'
            include 'strings.xml'
        }
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'org.json:json:20260814'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'net.jqwik:jqwik:1.10.2'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xlint:-options']
    options.errorprone {
        disableWarningsInGeneratedCode = true
        // The suggested replacements need Java 10+ APIs or Guava, which minSdk 24 code cannot use.
        disable('JdkObsolete', 'StringSplitter')
        // Tests construct inputs freely; the shipped sources are the subject of the check.
        if (name == 'compileTestJava') disableAllWarnings = true
    }
    if (name == 'compileJava') options.compilerArgs += ['-Werror']
}

test {
    useJUnitPlatform()
    // Each run explores new random inputs; a failure prints the seed that reproduces it.
    systemProperty 'jqwik.database', layout.buildDirectory.file('jqwik-database').get().asFile.path
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

// Floors sit just under measured coverage; raise them when tests improve, never lower them.
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit { counter = 'LINE'; minimum = 0.87 }
            limit { counter = 'BRANCH'; minimum = 0.72 }
        }
    }
}
check.dependsOn jacocoTestCoverageVerification

pitest {
    pitestVersion = '1.30.0'
    junit5PluginVersion = '1.2.3'
    targetClasses = ['org.still.saver.*']
    threads = Runtime.runtime.availableProcessors()
    outputFormats = ['HTML', 'XML']
    timestampedReports = false
    // Percent of injected bugs the tests must catch; same ratchet rule as the coverage floors.
    mutationThreshold = 73
}
