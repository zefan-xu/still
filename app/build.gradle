plugins { id 'com.android.application' }

android {
    namespace 'org.still.saver'
    compileSdk 35
    defaultConfig {
        applicationId 'org.still.saver'
        minSdk 24
        targetSdk 35
        versionCode 5
        versionName '1.1.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release { minifyEnabled false }
    }
    packagingOptions.jniLibs.useLegacyPackaging = true
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/licenseAssets')
}

tasks.register('copyLicenseAssets', Copy) {
    from rootProject.file('LICENSE')
    from rootProject.file('THIRD_PARTY_NOTICES.md')
    from rootProject.file('licenses')
    into layout.buildDirectory.dir('generated/licenseAssets/licenses')
}
tasks.named('preBuild').configure { dependsOn 'copyLicenseAssets' }

dependencies {
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
