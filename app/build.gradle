plugins { id 'com.android.application' }

// Releases pass -PstillVersion from the tag being published; local builds use the base version.
// Raise baseVersion for a minor or major release; automatic releases otherwise bump the patch.
def baseVersion = '1.2.0'
def stillVersion = providers.gradleProperty('stillVersion').getOrElse(baseVersion)
def versionParts = (stillVersion =~ /^(\d{1,3})\.(\d{1,2})\.(\d{1,2})$/)
if (!versionParts.matches()) throw new GradleException("stillVersion must be MAJOR.MINOR.PATCH with MINOR and PATCH below 100: $stillVersion")
def stillVersionCode = versionParts[0][1].toInteger() * 10000 + versionParts[0][2].toInteger() * 100 + versionParts[0][3].toInteger()
// The release workflow passes this so a missing key fails the job. Local and CI builds omit it
// and stay unsigned, which is what the reproducibility check compares.
def requireSigning = providers.gradleProperty('stillRequireSigning').getOrElse('false') == 'true'

android {
    namespace = 'org.still.saver'
    compileSdk = 35
    defaultConfig {
        applicationId = 'org.still.saver'
        minSdk = 24
        targetSdk = 35
        versionCode = stillVersionCode
        versionName = stillVersion
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    signingConfigs {
        release {
            def keystore = System.getenv('STILL_KEYSTORE')
            def keystorePassword = System.getenv('STILL_KEYSTORE_PASSWORD')
            def alias = System.getenv('STILL_KEY_ALIAS')
            def keyEntryPassword = System.getenv('STILL_KEY_PASSWORD')
            if (requireSigning && !keystore) {
                throw new GradleException('STILL_KEYSTORE is required to sign this release. Refusing an unsigned APK.')
            }
            if (keystore && (!keystorePassword || !alias || !keyEntryPassword)) {
                throw new GradleException('STILL_KEYSTORE is set but STILL_KEYSTORE_PASSWORD, STILL_KEY_ALIAS or STILL_KEY_PASSWORD is missing. Refusing an unsigned APK.')
            }
            if (keystore) {
                storeFile file(keystore)
                storePassword keystorePassword
                keyAlias alias
                keyPassword keyEntryPassword
            }
        }
    }
    buildTypes {
        debug {
            // CI sets stillMinifyDebug so the APK the device and live suites install is the
            // minified one. A local debug build stays unminified.
            if (providers.gradleProperty('stillMinifyDebug').getOrElse('false') == 'true') {
                minifyEnabled = true
                shrinkResources = true
                proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-instrumentation.pro'
                testProguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'proguard-instrumentation.pro'
            }
        }
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Unsigned unless the release key is present. -PstillRequireSigning=true fails instead.
            if (System.getenv('STILL_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    testOptions.unitTests.returnDefaultValues = true
    lint {
        abortOnError = true
        warningsAsErrors = true
        checkReleaseBuilds = true
        // Dependabot proposes upgrades; the app deliberately uses platform widgets.
        disable 'GradleDependency', 'NewerVersionAvailable', 'AndroidGradlePluginVersion', 'OldTargetApi',
                'UseSwitchCompatOrMaterialCode', 'UseSwitchCompatOrMaterialXml'
        // UI text lives in res/values/strings.xml so it can be translated; literals fail the build.
        error 'SetTextI18n', 'HardcodedText'
    }
    packagingOptions.jniLibs.useLegacyPackaging = true
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/licenseAssets').get().asFile
}

tasks.register('copyLicenseAssets', Copy) {
    from rootProject.file('LICENSE')
    from rootProject.file('THIRD_PARTY_NOTICES.md')
    from rootProject.file('licenses')
    into layout.buildDirectory.dir('generated/licenseAssets/licenses')
}
tasks.named('preBuild').configure { dependsOn 'copyLicenseAssets' }
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:-options']
}

// android.jar ships a stub org.json that throws. Unit tests need the real parser, ahead of that jar.
tasks.withType(Test).configureEach {
    doFirst {
        def jsonJars = classpath.files.findAll { it.name.startsWith('json-') && it.name.endsWith('.jar') }
        if (!jsonJars.isEmpty()) classpath = files(jsonJars) + classpath
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260814'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
