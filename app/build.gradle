plugins { id 'com.android.application' }

// Releases pass -PstillVersion from the tag being published; local builds use the base version.
// Raise baseVersion for a minor or major release; automatic releases otherwise bump the patch.
def baseVersion = '1.1.0'
def stillVersion = providers.gradleProperty('stillVersion').getOrElse(baseVersion)
def versionParts = (stillVersion =~ /^(\d{1,3})\.(\d{1,2})\.(\d{1,2})$/)
if (!versionParts.matches()) throw new GradleException("stillVersion must be MAJOR.MINOR.PATCH with MINOR and PATCH below 100: $stillVersion")
def stillVersionCode = versionParts[0][1].toInteger() * 10000 + versionParts[0][2].toInteger() * 100 + versionParts[0][3].toInteger()

android {
    namespace 'org.still.saver'
    compileSdk 35
    defaultConfig {
        applicationId 'org.still.saver'
        minSdk 24
        targetSdk 35
        versionCode stillVersionCode
        versionName stillVersion
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        release {
            def keystore = System.getenv('STILL_KEYSTORE')
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('STILL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('STILL_KEY_ALIAS')
                keyPassword System.getenv('STILL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            // Without the release key the APK stays unsigned and cannot be published by mistake.
            if (System.getenv('STILL_KEYSTORE')) signingConfig signingConfigs.release
        }
    }
    lint {
        abortOnError true
        warningsAsErrors true
        checkReleaseBuilds true
        baseline file('lint-baseline.xml')
        // Dependabot proposes upgrades; the app deliberately uses platform widgets and no translations.
        disable 'GradleDependency', 'NewerVersionAvailable', 'AndroidGradlePluginVersion', 'OldTargetApi',
                'UseSwitchCompatOrMaterialCode', 'UseSwitchCompatOrMaterialXml', 'SetTextI18n'
    }
    packagingOptions.jniLibs.useLegacyPackaging = true
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/licenseAssets')
}

tasks.register('copyLicenseAssets', Copy) {
    from rootProject.file('LICENSE')
    from rootProject.file('THIRD_PARTY_NOTICES.md')
    from rootProject.file('licenses')
    into layout.buildDirectory.dir('generated/licenseAssets/licenses')
}
tasks.named('preBuild').configure { dependsOn 'copyLicenseAssets' }

dependencies {
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'io.github.junkfood02.youtubedl-android:library:0.18.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
