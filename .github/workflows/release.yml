name: Release
on:
  # Mondays at 15:00 UTC (08:00 in California). Skipped when no app code changed since the last tag.
  schedule:
    - cron: '0 15 * * 1'
  workflow_dispatch:
    inputs:
      bump:
        description: 'auto releases only app changes as a patch (or the raised baseVersion); the others always release'
        type: choice
        options: [auto, patch, minor, major]
        default: auto
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-26.04
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      version_code: ${{ steps.plan.outputs.version_code }}
    steps:
      - name: Release only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Releases are cut from main, not ${GITHUB_REF}." >&2
          exit 1
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: plan
        run: python3 scripts/release.py plan --bump "${{ inputs.bump || 'auto' }}"
      - name: Summarize
        run: |
          {
            echo "### Release plan for \`${GITHUB_SHA::7}\`"
            echo '```json'
            python3 scripts/release.py plan --bump "${{ inputs.bump || 'auto' }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The full CI suite (JVM, mutation, lint, both emulators) on the exact commit being released.
  verify:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [plan, verify]
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION_CODE: ${{ needs.plan.outputs.version_code }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The store changelog lists the commits since the previous tag.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build the signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STILL_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          STILL_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          STILL_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=()
          [ -n "$KEYSTORE_BASE64" ] || missing+=(RELEASE_KEYSTORE_BASE64)
          [ -n "$STILL_KEYSTORE_PASSWORD" ] || missing+=(RELEASE_KEYSTORE_PASSWORD)
          [ -n "$STILL_KEY_ALIAS" ] || missing+=(RELEASE_KEY_ALIAS)
          [ -n "$STILL_KEY_PASSWORD" ] || missing+=(RELEASE_KEY_PASSWORD)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Refusing to publish an unsigned build. Missing signing secrets: ${missing[*]}. See README → Releases." >&2
            exit 1
          fi
          export STILL_KEYSTORE="$RUNNER_TEMP/still-release.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$STILL_KEYSTORE"
          if [ ! -s "$STILL_KEYSTORE" ]; then
            echo "STILL_KEYSTORE is missing or empty after decoding RELEASE_KEYSTORE_BASE64." >&2
            exit 1
          fi
          ./gradlew :app:assembleRelease -PstillVersion="$VERSION" -PstillRequireSigning=true
          rm -f "$STILL_KEYSTORE"
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Still-$VERSION.apk"
      - name: Verify signature, version and notices
        run: python3 scripts/release.py verify "dist/Still-$VERSION.apk" --version "$VERSION"
      - name: Free disk space for the emulator
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke-test the exact APK on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          disk-size: 4096M
          script: python3 scripts/release.py smoke "dist/Still-$VERSION.apk" --version "$VERSION"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum "Still-$VERSION.apk" > SHA256SUMS.txt
          python3 ../scripts/release.py notes "Still-$VERSION.apk" --version "$VERSION" > notes.md
          # Main only takes pull requests, so the fastlane copy is committed later (docs/distribution.md).
          python3 ../scripts/release.py changelog --version "$VERSION" > "changelog-$VERSION_CODE.txt"
          gh release create "$TAG" "Still-$VERSION.apk" SHA256SUMS.txt "changelog-$VERSION_CODE.txt" \
            --target "$GITHUB_SHA" --title "Still $VERSION" --notes-file notes.md --generate-notes --latest
          echo "Published [Still $VERSION](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$TAG)" >> "$GITHUB_STEP_SUMMARY"
