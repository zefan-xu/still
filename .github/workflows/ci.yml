name: CI
on:
  pull_request:
  push:
    branches: [main]
  # The release workflow runs this exact suite on the commit it is about to publish.
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: Checks (tests, coverage, mutation, lint, builds)
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Lint workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          # The default also installs the long-removed "tools" package, which now fails.
          packages: platform-tools
      # v6 adds a proprietary caching component under separate terms; v5 is MIT-licensed.
      - uses: gradle/actions/setup-gradle@v6
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 scripts/test.py local
      - name: Summarize quality
        if: always()
        run: python3 scripts/ci_summary.py >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checks
          path: |
            artifacts/test-runs/
            core-tests/build/test-results/
            core-tests/build/reports/
            app/build/reports/lint-results-*
            app/build/outputs/apk/debug/
  device:
    name: Device (API ${{ matrix.api }})
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          # The default ~7 GB userdata partition sometimes exceeds the runner's free space.
          disk-size: 4096M
          script: python3 scripts/test.py device
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-api-${{ matrix.api }}
          path: artifacts/test-runs/
  # Android 7–9 storage, prompt, font and thumbnail paths. Not in "CI passed" until it proves stable.
  device-legacy:
    name: Device (API 28, legacy)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: default
          disable-animations: true
          disk-size: 4096M
          script: python3 scripts/test.py legacy
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-api-28-legacy
          path: artifacts/test-runs/
  # The single required status check; it passes only when every job it needs passed.
  passed:
    name: CI passed
    if: always()
    needs: [checks, device]
    runs-on: ubuntu-26.04
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then exit 1; fi
          done
