name: Pull request
on:
  # pull_request_target runs this trusted file from main; it never checks out or runs PR code.
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  label:
    name: Label by changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: true

  dependabot:
    name: Auto-merge safe dependency updates
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@v3
      # Merges only after "CI passed"; major versions wait for a human.
      - if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
