name: Live platforms
on:
  # Sundays, the day before the weekly release, so a platform change is known before shipping.
  schedule:
    - cron: '0 14 * * 0'
  workflow_dispatch:
    inputs:
      quality:
        description: 'Which qualities to download'
        type: choice
        options: [both, highest, smallest]
        default: both
permissions:
  contents: read
concurrency:
  group: live
  cancel-in-progress: false
jobs:
  live:
    name: Real downloads from every platform
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    env:
      ORG_GRADLE_PROJECT_stillMinifyDebug: 'true'
    outputs:
      verdict: ${{ steps.summary.outputs.verdict }}
      blocked: ${{ steps.summary.outputs.blocked }}
      broken: ${{ steps.summary.outputs.broken }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v6
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Free disk space for the emulator
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # scripts/test.py exits 0 when every failed platform is blocked, and 1 when one is broken.
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          disk-size: 4096M
          script: python3 scripts/test.py live --quality ${{ inputs.quality || 'both' }}
      - name: Summarize
        id: summary
        if: always()
        run: |
          python3 scripts/ci_summary.py >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci_summary.py --live-outputs | tee -a "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-platforms
          path: artifacts/test-runs/

  report:
    name: Track broken and blocked platforms in issues
    needs: live
    # Manual runs write the same summary. Only the weekly schedule opens or closes issues.
    if: always()
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      EVENT: ${{ github.event_name }}
      RESULT: ${{ needs.live.result }}
      LIVE_VERDICT: ${{ needs.live.outputs.verdict }}
      BLOCKED: ${{ needs.live.outputs.blocked }}
      BROKEN: ${{ needs.live.outputs.broken }}
    steps:
      - name: Decide this week's verdict
        id: week
        run: |
          # A blocked-only live run exits 0, so job success is not "every platform passed".
          case "$LIVE_VERDICT" in
            passed|blocked|broken) verdict=$LIVE_VERDICT ;;
            *)
              if [ "$RESULT" = success ]; then verdict=passed; else verdict=broken; fi
              ;;
          esac
          mkdir -p week && echo "$verdict" > week/verdict
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"
          {
            echo "### Live check: \`$verdict\`"
            echo
            echo "Blocked: ${BLOCKED:-none}"
            echo
            echo "Broken: ${BROKEN:-none}"
            echo
            echo "Run: $RUN_URL"
          } >> "$GITHUB_STEP_SUMMARY"
      # Later scheduled runs read this to count blocked-only weeks in a row.
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'schedule'
        with:
          name: live-verdict
          path: week/
          retention-days: 35
      - name: Summarize, and on the weekly schedule open or close issues
        env:
          VERDICT: ${{ steps.week.outputs.verdict }}
        run: |
          streak=0
          if [ "$VERDICT" = blocked ]; then
            if [ "$EVENT" = schedule ]; then streak=1; fi
            for id in $(gh run list --workflow live.yml --event schedule --status completed --limit 2 --json databaseId --jq '.[].databaseId'); do
              rm -rf previous
              gh run download "$id" --name live-verdict --dir previous 2>/dev/null || break
              [ "$(cat previous/verdict 2>/dev/null)" = blocked ] || break
              streak=$((streak + 1))
            done
            echo "Blocked from GitHub's network, $streak scheduled week(s) in a row: ${BLOCKED:-none}. Only broken platforms open \`live-check\`." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$EVENT" != schedule ]; then
            echo "Manual run: recorded the verdict above and did not open or close issues." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          gh label create live-check --color D97757 --description "Weekly real-download check" 2>/dev/null || true
          gh label create live-blocked --color FBCA04 --description "A platform refused GitHub's network three weeks in a row" 2>/dev/null || true
          check=$(gh issue list --label live-check --state open --json number --jq '.[0].number')
          blocked_issue=$(gh issue list --label live-blocked --state open --json number --jq '.[0].number')
          case "$VERDICT" in
            passed)
              for open in $check $blocked_issue; do gh issue close "$open" --comment "Every platform downloads again: $RUN_URL"; done
              ;;
            broken)
              detail="Broken: ${BROKEN:-see the job log}. Blocked: ${BLOCKED:-none}."
              if [ -n "$check" ]; then
                gh issue comment "$check" --body "Still failing on $(date -u +%F): $RUN_URL. $detail"
              else
                gh issue create --label live-check --title "A platform stopped downloading" --body \
                  "The weekly live check failed: $RUN_URL. $detail The job summary lists each error and the artifact has per-platform JSON. A public sample may have been deleted, or a platform changed its pages."
              fi
              ;;
            blocked)
              if [ -n "$check" ]; then
                gh issue close "$check" --comment "No platform is broken on $(date -u +%F): $RUN_URL. Blocked from GitHub's network: $BLOCKED."
              fi
              if [ "$streak" -ge 3 ]; then
                if [ -n "$blocked_issue" ]; then
                  gh issue comment "$blocked_issue" --body "Still blocked on $(date -u +%F): $BLOCKED. $RUN_URL"
                else
                  gh issue create --label live-blocked --title "A platform has refused GitHub's network for three weeks" --body \
                    "The last three weekly live checks failed only because platforms refused requests from GitHub's network (rate limits, bot checks or login walls): $BLOCKED. Latest run: $RUN_URL. The job summary has each error. The app may still work from home networks, but the live check no longer covers these platforms."
                fi
              fi
              ;;
          esac
