name: Android
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live:
        description: 'Also test downloads from public platforms'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          # The default also installs the long-removed "tools" package, which now fails.
          packages: platform-tools
      # v6 adds a proprietary caching component under separate terms; v5 is MIT-licensed.
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 scripts/test.py local
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-checks
          path: |
            artifacts/test-runs/
            core-tests/build/test-results/
            core-tests/build/reports/tests/
            app/build/reports/lint-results-debug.*
            app/build/outputs/apk/
  device:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          # The default also installs the long-removed "tools" package, which now fails.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          disable-animations: true
          # The default ~7 GB userdata partition sometimes exceeds the runner's free space.
          disk-size: 4096M
          script: python3 scripts/test.py device
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: device-api-${{ matrix.api }}
          path: |
            artifacts/test-runs/
            core-tests/build/test-results/
            app/build/reports/lint-results-debug.*
  live:
    if: github.event_name == 'workflow_dispatch' && inputs.live
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          # The default also installs the long-removed "tools" package, which now fails.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v5
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          # The default ~7 GB userdata partition sometimes exceeds the runner's free space.
          disk-size: 4096M
          script: python3 scripts/test.py live --quality both
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-public-platforms
          path: artifacts/test-runs/
